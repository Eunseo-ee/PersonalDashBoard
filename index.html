<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>취업 준비 대시보드</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>body{margin:0}[hidden]{display:none!important}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<style>
/* Layout: 한 장짜리 계기판. 상단 요약 띠 → 오늘/목표 2단 → 프로젝트 3열 → 지원 현황. 편집 모드에서 모든 글자가 입력칸으로 바뀜 */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface2:#F5F7F8; --ink:#121C26; --muted:#586674; --line:#D5DCE2;
  --grid:rgba(18,28,38,.05);
  --accent:#2748D8; --accent-soft:#E4EAFD; --on-accent:#FFFFFF;
  --good:#1B8553; --good-soft:#E1F3EA; --on-good:#FFFFFF;
  --warn:#9A6208; --warn-soft:#FBF0DA;
  --bad:#B3362B; --bad-soft:#FAE5E2;
  --font:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141A; --surface:#161E26; --surface2:#1B252F; --ink:#E7EDF2; --muted:#93A2B0; --line:#2A3743;
    --grid:rgba(231,237,242,.045);
    --accent:#7B97FF; --accent-soft:#1D2A52; --on-accent:#0E141A;
    --good:#4FC48A; --good-soft:#14301F; --on-good:#0E141A;
    --warn:#E3A94A; --warn-soft:#33260E;
    --bad:#F08377; --bad-soft:#38191A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161E26; --surface2:#1B252F; --ink:#E7EDF2; --muted:#93A2B0; --line:#2A3743;
  --grid:rgba(231,237,242,.045);
  --accent:#7B97FF; --accent-soft:#1D2A52; --on-accent:#0E141A;
  --good:#4FC48A; --good-soft:#14301F; --on-good:#0E141A;
  --warn:#E3A94A; --warn-soft:#33260E;
  --bad:#F08377; --bad-soft:#38191A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:14px; line-height:1.55;
  padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:1080px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
h1,h2,h3,p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:16px; min-width:0}
.panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px}
.panel-head h2{font-size:15px; font-weight:600}
.count{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.hint{font-size:12px; color:var(--muted); margin-bottom:8px}

/* header */
.top{padding:0; overflow:hidden}
.top-main{
  padding:20px 20px 18px; display:flex; flex-wrap:wrap; gap:12px 24px; align-items:flex-end; justify-content:space-between;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px; border-bottom:1px solid var(--line);
}
.head-box{flex:1 1 320px; min-width:0}
.top h1{font-size:26px; font-weight:700; letter-spacing:-.01em; text-wrap:balance}
.date{font-family:var(--mono); font-size:12px; color:var(--muted); margin-bottom:6px; font-variant-numeric:tabular-nums}
.goal-line{margin-top:6px; color:var(--muted); font-size:13px; max-width:60ch}
.goal-line b{color:var(--ink); font-weight:600}
.head-tools{display:flex; flex-direction:column; align-items:flex-end; gap:8px}
.save{font-family:var(--mono); font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px}
.save::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--muted)}
.save[data-s="saved"]::before{background:var(--good)}
.save[data-s="saving"]::before{background:var(--warn)}
.save[data-s="error"]::before,.save[data-s="readonly"]::before{background:var(--bad)}
.banner{background:var(--accent-soft); color:var(--accent); font-size:12px; padding:8px 20px; border-bottom:1px solid var(--line)}
.stats{display:grid; grid-template-columns:repeat(4, minmax(0,1fr))}
.stat{padding:14px 20px; border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat .k{font-size:12px; color:var(--muted)}
.stat .v{font-family:var(--mono); font-size:26px; font-weight:500; font-variant-numeric:tabular-nums; line-height:1.2; margin-top:2px}
.stat .v small{font-size:13px; color:var(--muted); margin-left:2px}

/* layout */
.cols{display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:16px; align-items:start}
.col{display:flex; flex-direction:column; gap:16px; min-width:0}
.proj-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap:16px; align-items:start}

/* lists */
.list{list-style:none; margin:0; padding:0}
.row{display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid var(--line); min-width:0}
.list .row:first-child{border-top:0}
.row label{display:flex; align-items:center; gap:10px; flex:1; min-width:0; cursor:pointer}
.row .t{min-width:0; overflow-wrap:anywhere}
.row.done .t{color:var(--muted)}
.chip{
  font-family:var(--mono); font-size:11px; padding:1px 7px; border-radius:3px; white-space:nowrap;
  background:var(--surface2); color:var(--muted); border:1px solid var(--line);
}
.chip.good{background:var(--good-soft); color:var(--good); border-color:transparent}
.chip.bad{background:var(--bad-soft); color:var(--bad); border-color:transparent}
.chip.warn{background:var(--warn-soft); color:var(--warn); border-color:transparent}
.chip.accent{background:var(--accent-soft); color:var(--accent); border-color:transparent}
.del{
  border:0; background:none; color:var(--muted); cursor:pointer; padding:2px 6px; border-radius:4px; font-size:16px; line-height:1; flex:none;
}
.del:hover{color:var(--bad); background:var(--bad-soft)}
.del.txt{font-size:12px; padding:4px 8px; border:1px solid var(--line)}
.del.txt.armed{color:var(--bad); background:var(--bad-soft); border-color:transparent}
.empty{color:var(--muted); font-size:13px; padding:10px 0}

input[type=checkbox]{
  appearance:none; -webkit-appearance:none; width:18px; height:18px; flex:none; margin:0; cursor:pointer;
  border:1.5px solid var(--muted); border-radius:4px; background:var(--surface); display:grid; place-content:center;
}
input[type=checkbox]:checked{background:var(--good); border-color:var(--good)}
input[type=checkbox]:checked::after{
  content:""; width:9px; height:5px; border-left:2px solid var(--on-good); border-bottom:2px solid var(--on-good);
  transform:rotate(-45deg) translate(1px,-1px);
}

/* forms and edit fields */
.add{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.add input[type=text], .add select, select.st, input.ed, textarea.ed, select.ed{
  border:1px solid var(--line); background:var(--surface2); border-radius:5px; padding:7px 10px; min-width:0;
}
.add input[type=text]{flex:1 1 140px}
input.ed, textarea.ed{width:100%}
textarea.ed{resize:vertical; font-size:13px}
input.ed.flex{flex:1 1 0}
select.ed{padding:6px 8px; flex:none}
.btn{
  border:0; background:var(--accent); color:var(--on-accent); font-weight:600; padding:7px 14px; border-radius:5px; cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface); color:var(--ink); border:1px solid var(--line)}
.btn.ghost:hover{filter:none; border-color:var(--accent)}
.btn.on{background:var(--accent); color:var(--on-accent); border-color:var(--accent)}
.btn.sm{padding:4px 10px; font-size:12px; font-weight:500}
.addbtn{
  border:1px dashed var(--line); background:none; color:var(--muted); padding:5px 10px; border-radius:5px; cursor:pointer; font-size:12px; margin-top:8px;
}
.addbtn:hover{border-color:var(--accent); color:var(--accent)}
select.st{padding:3px 8px; font-size:12px; font-family:var(--mono)}
select.st.good{background:var(--good-soft); color:var(--good)}
select.st.bad{background:var(--bad-soft); color:var(--bad)}
select.st.warn{background:var(--warn-soft); color:var(--warn)}
select.st.accent{background:var(--accent-soft); color:var(--accent)}
.stack{display:flex; flex-direction:column; gap:8px}
.inline{display:flex; gap:8px; align-items:center; min-width:0}

/* week */
.week{display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:8px}
.day{display:flex; flex-direction:column; align-items:center; gap:4px; font-family:var(--mono); font-size:11px; color:var(--muted)}
.day .bar{width:100%; max-width:34px; height:64px; background:var(--surface2); border:1px solid var(--line); border-radius:4px; display:flex; align-items:flex-end; overflow:hidden}
.day .bar i{display:block; width:100%; background:var(--accent)}
.day.today{color:var(--ink); font-weight:500}
.day.today .bar{border-color:var(--accent)}
.day .n{font-variant-numeric:tabular-nums}

/* projects */
.proj h3{font-family:var(--mono); font-size:15px; font-weight:500; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.proj .meta{font-size:12px; color:var(--muted); margin-top:4px; overflow-wrap:anywhere}
.prog{display:flex; align-items:center; gap:10px; margin:12px 0 6px}
.track{flex:1; height:6px; background:var(--surface2); border:1px solid var(--line); border-radius:3px; overflow:hidden}
.track i{display:block; height:100%; background:var(--accent)}
.track.full i{background:var(--good)}
.grp{font-size:12px; font-weight:600; color:var(--muted); margin:12px 0 2px}
.grp-ed{display:flex; gap:8px; align-items:center; margin:14px 0 4px}
.proj .row{padding:5px 0}
.proj-tools{display:flex; gap:8px; align-items:center}

.cred .row{align-items:flex-start}
.cred .name{font-weight:500}
.cred .sub{font-size:12px; color:var(--muted)}
.cred .row > div{flex:1; min-width:0}

.app-name{font-weight:500}
.app-pos{font-size:12px; color:var(--muted)}
.row > .grow{flex:1; min-width:0}

.boot{max-width:1080px; margin:40px auto; color:var(--muted); text-align:center}
.auth{max-width:360px; margin:40px auto 0; display:flex; flex-direction:column; gap:12px}
.auth h1{font-size:22px; font-weight:700}
.auth .hint{margin-bottom:0}
@media (max-width: 760px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2, minmax(0,1fr))}
  .stat:nth-child(3){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--line)}
  .top h1{font-size:22px}
  .head-tools{align-items:flex-start}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<p class="boot" id="boot">불러오는 중…</p>
<div class="wrap" id="auth" hidden>
  <section class="panel auth">
    <h1>취업 준비 대시보드</h1>
    <p class="hint">내 데이터는 로그인한 나만 볼 수 있어요.</p>
    <form class="stack" id="login-form" autocomplete="on">
      <input class="ed" type="email" id="auth-email" placeholder="이메일" autocomplete="email" aria-label="이메일" required>
      <input class="ed" type="password" id="auth-pw" placeholder="비밀번호 (6자 이상)" autocomplete="current-password" aria-label="비밀번호" required>
      <div class="inline"><button class="btn" type="submit">로그인</button><button class="btn ghost" type="button" id="signup">가입</button></div>
      <p class="hint" id="auth-msg" role="status" aria-live="polite"></p>
    </form>
  </section>
</div>
<div class="wrap" id="app" hidden>
  <header class="panel top">
    <div class="top-main">
      <div class="head-box">
        <div class="date" id="date"></div>
        <div id="head-box"></div>
      </div>
      <div class="head-tools">
        <div class="inline"><button class="btn ghost" id="edit-toggle" type="button">편집</button><button class="btn ghost" id="logout" type="button">로그아웃</button></div>
        <div class="save" id="save" data-s="idle" role="status" aria-live="polite"></div>
      </div>
    </div>
    <div class="banner" id="banner" hidden>편집 중이에요. 글자를 고치면 바로 저장돼요. 체크는 편집을 끝내면 다시 할 수 있어요.</div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="cols">
    <div class="col">
      <section class="panel" aria-labelledby="h-today">
        <div class="panel-head"><h2 id="h-today">오늘 할 일</h2><span class="count" id="today-count"></span></div>
        <p class="hint">기본 항목은 예시예요. 편집 버튼으로 이름도 바꿀 수 있어요.</p>
        <ul class="list" id="today-list"></ul>
        <form class="add" id="routine-form" autocomplete="off">
          <input type="text" id="routine-input" placeholder="할 일 추가" maxlength="60" aria-label="할 일 추가">
          <select id="routine-tag" aria-label="분류">
            <option value="coding">코테</option>
            <option value="project">프로젝트</option>
            <option value="lang">어학</option>
            <option value="apply">지원</option>
            <option value="log">기록</option>
          </select>
          <button class="btn" type="submit">추가</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="h-week">
        <div class="panel-head"><h2 id="h-week">최근 7일</h2><span class="count">완료한 할 일 비율</span></div>
        <div class="week" id="week"></div>
      </section>
    </div>

    <div class="col">
      <section class="panel" aria-labelledby="h-goals">
        <div class="panel-head"><h2 id="h-goals">앞으로 목표</h2><span class="count" id="goal-count"></span></div>
        <ul class="list" id="goal-list"></ul>
        <form class="add" id="goal-form" autocomplete="off">
          <input type="text" id="goal-input" placeholder="목표 추가" maxlength="80" aria-label="목표 추가">
          <button class="btn" type="submit">추가</button>
        </form>
      </section>

      <section class="panel cred" aria-labelledby="h-cred">
        <div class="panel-head"><h2 id="h-cred">자격 · 스펙</h2></div>
        <ul class="list" id="cred-list"></ul>
        <div id="cred-tools"></div>
      </section>
    </div>
  </div>

  <section aria-labelledby="h-proj">
    <div class="panel-head">
      <h2 id="h-proj" style="font-size:15px;font-weight:600">포트폴리오 프로젝트</h2>
      <div class="proj-tools"><span class="count" id="proj-count"></span><span id="proj-tools"></span></div>
    </div>
    <div class="proj-grid" id="proj-grid"></div>
  </section>

  <section class="panel" aria-labelledby="h-app">
    <div class="panel-head"><h2 id="h-app">지원 현황</h2><span class="count" id="app-count"></span></div>
    <ul class="list" id="app-list"></ul>
    <form class="add" id="app-form" autocomplete="off">
      <input type="text" id="app-company" placeholder="회사명" maxlength="40" aria-label="회사명">
      <input type="text" id="app-role" placeholder="직무 (예: 백엔드, 임베디드)" maxlength="40" aria-label="직무">
      <button class="btn" type="submit">추가</button>
    </form>
  </section>
</div>

<script>
(function(){
  var TAGS = {coding:'코테', project:'프로젝트', lang:'어학', apply:'지원', log:'기록'};
  var STATUSES = [
    ['prep','준비 중',''], ['applied','지원 완료','accent'], ['doc','서류 통과','good'],
    ['test','코테·과제','warn'], ['interview','면접','warn'], ['offer','합격','good'], ['fail','불합격','bad']
  ];
  var CRED_KINDS = {have:['보유','good'], expired:['만료','bad'], prep:['준비 중','accent'], log:['이력',''], wip:['진행 중','warn']};
  var COLOR_KINDS = [['accent','파랑'], ['good','초록'], ['warn','주황'], ['','회색']];

  var DEFAULT_HEAD = {
    title:'취업 준비 대시보드',
    goal:'목표 · 사기업 개발자 취업.',
    sub:'규모와 상관없이 지원하고, 경력을 쌓아 이직으로 상위 기업을 노립니다.'
  };
  var DEFAULT_ROUTINE = [
    {id:'r1', label:'코딩테스트 1문제 풀기', tag:'coding'},
    {id:'r2', label:'포트폴리오 프로젝트 작업', tag:'project'},
    {id:'r3', label:'오픽 말하기 연습', tag:'lang'},
    {id:'r4', label:'채용 공고 확인 · 지원서 작성', tag:'apply'},
    {id:'r5', label:'트러블슈팅 · 설계 고민 기록', tag:'log'}
  ];
  var DEFAULT_GOALS = [
    {id:'g1', text:'오픽 성적 취득 (어학성적 확보)', done:false},
    {id:'g2', text:'book-log Redis 캐싱 마무리', done:false},
    {id:'g3', text:'book-log 프론트엔드 미완성 화면 완성', done:false},
    {id:'g4', text:'시간표 프로젝트 리메이크 + 트러블슈팅 기록', done:false},
    {id:'g5', text:'원티드 이력서 작성 (백엔드용 · 임베디드용)', done:false}
  ];
  var DEFAULT_CREDS = [
    {id:'c1', name:'전기기사', sub:'', kind:'have'},
    {id:'c2', name:'정보처리기사', sub:'', kind:'have'},
    {id:'c3', name:'한국사능력검정시험 1급', sub:'', kind:'have'},
    {id:'c4', name:'토익 870', sub:'공기업용으로 딴 성적, 유효기간이 지남', kind:'expired'},
    {id:'c5', name:'오픽', sub:'토익 재응시 대신 오픽으로 어학성적 확보', kind:'prep'},
    {id:'c6', name:'코딩테스트', sub:'카카오 1차 합격, 2차 탈락 (작년 말) · 백준 골드5까지 안정적', kind:'log'}
  ];
  var PROJECTS_DEF = [
    {id:'bl', name:'book-log', repo:'Eunseo-ee/book-log', label:'진행 중', color:'accent',
     meta:'팀 프로젝트 · 외부 API 통합, 하이라이트, 통계/리캡, 캐싱, PM 겸임\n프론트 Next.js · React · TypeScript · Tailwind',
     groups:[
      {t:'내 담당 · 백엔드', items:[['bl-search','통합검색',1],['bl-hl','하이라이트 필터링',1],['bl-stat','통계 · 리캡 로직',1],['bl-exc','예외처리',1],['bl-redis','Redis 캐싱',0]]},
      {t:'프론트엔드', items:[['bl-cal','캘린더',1],['bl-hllist','하이라이트 목록',1],['bl-mini','사이드바 미니캘린더',1],['bl-searchui','통합검색 화면',0],['bl-save','콘텐츠 저장 폼',0],['bl-login','로그인 화면',0],['bl-hlform','하이라이트 작성/수정 폼',0]]},

  /* ---------- persistence ---------- */

  function applyRemote(data){

    else if (data.ms){
      state.projects = defaultProjects();
      state.projects.forEach(function(p){ p.groups.forEach(function(g){ g.items.forEach(function(it){
        if (Object.prototype.hasOwnProperty.call(data.ms, it.id)) it.done = !!data.ms[it.id];

  function prune(){

  function commit(){

  }
  function changed(){ render(); commit(); }
  async function flush(){
    if (!userId) return;
    if (saving){ dirty = true; return; }
    saving = true;
    do {
      dirty = false;
      try {
        prune();
        var res = await sb.from('dashboard_state').upsert({user_id:userId, data:clone(state), updated_at:new Date().toISOString()}, {onConflict:'user_id'});
        if (res.error) throw res.error;
        setStatus('saved');
      } catch(e){
        if (window.console) console.error(e);
        setStatus('error');
      }
    } while (dirty);
    saving = false;
  }

  /* ---------- events ---------- */
  document.addEventListener('change', function(e){

    } else if (d.goal){
      state.goals.forEach(function(g){ if (g.id === d.goal) g.done = t.checked; }); changed();
    } else if (d.appstatus){

  function onEdit(t){

      case 'routine-tag': r = state.routine.filter(function(x){ return x.id === d.id; })[0]; if (r) r.tag = v; break;
      case 'goal-text': c = state.goals.filter(function(x){ return x.id === d.id; })[0]; if (c) c.text = v; break;
      case 'cred-name': c = state.creds.filter(function(x){ return x.id === d.id; })[0]; if (c) c.name = v; break;
      case 'cred-sub': c = state.creds.filter(function(x){ return x.id === d.id; })[0]; if (c) c.sub = v; break;
      case 'cred-kind': c = state.creds.filter(function(x){ return x.id === d.id; })[0]; if (c) c.kind = v; break;
      case 'app-company': a = state.apps.filter(function(x){ return x.id === d.id; })[0]; if (a) a.company = v; break;
      case 'app-role': a = state.apps.filter(function(x){ return x.id === d.id; })[0]; if (a) a.role = v; break;
      case 'p-name': p = P(d.p); if (p) p.name = v; break;
      case 'p-repo': p = P(d.p); if (p) p.repo = v.trim(); break;
      case 'p-label': p = P(d.p); if (p) p.label = v; break;
      case 'p-color': p = P(d.p); if (p) p.color = v; break;
      case 'p-meta': p = P(d.p); if (p) p.meta = v; break;
      case 'g-title': g = G(P(d.p), d.g); if (g) g.t = v; break;
      case 'i-text': it = I(G(P(d.p), d.g), d.i); if (it) it.text = v; break;
      default: return;
    }
    commit();
  }

  document.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('button') : null;
    var d = el ? el.dataset : {};
    if (pendingDel && !(d.delP || d.delG)){ pendingDel = null; if (editing) renderProjects(); }
    if (!el) return;
    if (el.id === 'edit-toggle'){ editing = !editing; pendingDel = null; render(); return; }
    if (el.id === 'logout'){ sb.auth.signOut(); return; }
    if (d.delRoutine){ state.routine = state.routine.filter(function(r){ return r.id !== d.delRoutine; }); changed(); }
    else if (d.delGoal){ state.goals = state.goals.filter(function(g){ return g.id !== d.delGoal; }); changed(); }
    else if (d.delApp){ state.apps = state.apps.filter(function(a){ return a.id !== d.delApp; }); changed(); }
    else if (d.delCred){ state.creds = state.creds.filter(function(c){ return c.id !== d.delCred; }); changed(); }
    else if (d.delI){ var g1 = G(P(d.p), d.g); if (g1){ g1.items = g1.items.filter(function(i){ return i.id !== d.delI; }); changed(); } }
    else if (d.delG){
      if (pendingDel === 'g:' + d.delG){ var p1 = P(d.p); if (p1) p1.groups = p1.groups.filter(function(g){ return g.id !== d.delG; }); pendingDel = null; changed(); }
      else { pendingDel = 'g:' + d.delG; renderProjects(); }
    }
    else if (d.delP){
      if (pendingDel === 'p:' + d.delP){ state.projects = state.projects.filter(function(p){ return p.id !== d.delP; }); pendingDel = null; changed(); }
      else { pendingDel = 'p:' + d.delP; renderProjects(); }
    }
    else if (d.add === 'cred'){ var cid = 'c' + uid(); state.creds.push({id:cid, name:'', sub:'', kind:'have'}); focusId = cid; changed(); }
    else if (d.add === 'project'){
      var pid = 'p' + uid(), gid = pid + '-g0';
      state.projects.push({id:pid, name:'', repo:'', label:'진행 중', color:'accent', meta:'', groups:[{id:gid, t:'할 일', items:[]}]});
      focusId = pid; changed();
    }
    else if (d.add === 'group'){ var p2 = P(d.p); if (p2){ var ng = p2.id + '-g' + uid(); p2.groups.push({id:ng, t:'', items:[]}); focusId = ng; changed(); } }
    else if (d.add === 'item'){ var g2 = G(P(d.p), d.g); if (g2){ var ni = 'i' + uid(); g2.items.push({id:ni, text:'', done:false}); focusId = ni; changed(); } }
  });

  $('routine-form').addEventListener('submit', function(e){
    e.preventDefault();
    var v = $('routine-input').value.trim(); if (!v) return;
    state.routine.push({id:'r' + uid(), label:v, tag:$('routine-tag').value});
    $('routine-input').value = ''; changed();
  });
  $('goal-form').addEventListener('submit', function(e){
    e.preventDefault();
    var v = $('goal-input').value.trim(); if (!v) return;
    state.goals.push({id:'g' + uid(), text:v, done:false});
    $('goal-input').value = ''; changed();
  });
  $('app-form').addEventListener('submit', function(e){
    e.preventDefault();
    var c = $('app-company').value.trim(); if (!c) return;
    state.apps.push({id:'a' + uid(), company:c, role:$('app-role').value.trim(), status:'prep'});
    $('app-company').value = ''; $('app-role').value = ''; changed();
  });

  /* ---------- boot ---------- */
  var now = new Date();
  $('date').textContent = now.getFullYear() + '.' + pad(now.getMonth() + 1) + '.' + pad(now.getDate()) + ' (' + DOW[now.getDay()] + ')';
  render();

  var SUPABASE_URL = 'https://bkaytrqxcaialedltfox.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_KaZUGivoh_nLVG17TfUgaQ_Se6SfQLY';
  var loadedFor = null;

  function show(which){ $('boot').hidden = which !== 'boot'; $('auth').hidden = which !== 'auth'; $('app').hidden = which !== 'app'; }
  function resetState(){
    state.head = clone(DEFAULT_HEAD); state.checks = {}; state.routine = clone(DEFAULT_ROUTINE); state.goals = clone(DEFAULT_GOALS);
    state.creds = clone(DEFAULT_CREDS); state.projects = defaultProjects(); state.apps = [];
  }
  async function load(){
    var res = await sb.from('dashboard_state').select('data').eq('user_id', userId).maybeSingle();
    if (res.error){ if (window.console) console.error(res.error); setStatus('error'); return false; }
    if (res.data && res.data.data && Object.keys(res.data.data).length){ applyRemote(res.data.data); }
    else { var local = lsRead(); if (local) applyRemote(local); commit(); }
    return true;
  }
  async function enter(session){
    if (loadedFor === session.user.id) return;
    loadedFor = session.user.id; userId = session.user.id;
    show('app'); setStatus('saving');
    var ok = await load();
    render();
    if (ok && !timer && !saving) setStatus('saved');
  }
  function leave(){ loadedFor = null; userId = null; editing = false; resetState(); render(); show('auth'); }

  function authMsg(t){ $('auth-msg').textContent = t || ''; }
  $('login-form').addEventListener('submit', async function(e){
    e.preventDefault(); authMsg('');
    var r = await sb.auth.signInWithPassword({email:$('auth-email').value.trim(), password:$('auth-pw').value});
    if (r.error) authMsg('로그인하지 못했어요. 이메일과 비밀번호를 확인해 주세요.');
  });
  $('signup').addEventListener('click', async function(){
    authMsg('');
    var email = $('auth-email').value.trim(), pw = $('auth-pw').value;
    if (!email || pw.length < 6){ authMsg('이메일과 6자 이상 비밀번호를 입력해 주세요.'); return; }
    var r = await sb.auth.signUp({email:email, password:pw});
    if (r.error){ authMsg(r.error.message); return; }
    if (!r.data.session) authMsg('가입 확인 메일을 보냈어요. 메일의 링크를 누른 뒤 로그인해 주세요.');
  });
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible' || !userId || timer || saving) return;
    var ae = document.activeElement; if (ae && ae.dataset && ae.dataset.e) return;
    load().then(function(ok){ if (ok) render(); });
  });

  if (!window.supabase){
    $('boot').textContent = '라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.';
  } else {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    sb.auth.onAuthStateChange(function(ev, session){
      setTimeout(function(){ if (session) enter(session); else leave(); }, 0);
    });
  }
})();
</script>
</body>
