name: Deploy to GitHub Pages

# main 브랜치에 push 하면 자동으로 배포된다. (브랜치 이름이 master라면 아래를 바꾸세요)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build app
        working-directory: app
        run: |
          npm ci
          npm run build

      # 기존 개인용 사이트(루트의 index.html 등)는 그대로 두고, 새 앱은 /app/ 아래에 합쳐서 올린다.
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='app' --exclude='_site' \
            ./ _site/
          mkdir -p _site/app
          cp -r app/dist/. _site/app/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
